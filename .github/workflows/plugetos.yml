name: PlugetOS Nested Arch Build

on: 
  workflow_dispatch: 

jobs:
  qemu-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget

      - name: Download Arch ISO
        run: |
          wget https://mirror.rackspace.com/archlinux/iso/latest/archlinux-x86_64.iso -O arch.iso

      - name: Create Virtual Disk
        run: qemu-img create -f qcow2 pluget_disk.qcow2 10G

      - name: Boot Arch via QEMU
        run: |
          # Bu komut Arch'ı başlatır ve terminal üzerinden erişim sağlar
          qemu-system-x86_64 \
            -m 2G \
            -smp 2 \
            -drive file=pluget_disk.qcow2,format=qcow2 \
            -cdrom arch.iso \
            -boot d \
            -nographic \
            -net nic -net user \
            -append "console=ttyS0" \
            -serial mon:stdio
